<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#63778e"/></marker></defs><rect width="1440" height="1060" fill="#f7f9fc"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="60" y="50" text-anchor="start" font-size="30" fill="#203044"><tspan x="60" dy="0">Daylight｜本轮实际部署与请求边界</tspan></text><text x="60" y="83" text-anchor="start" font-size="17" fill="#526477"><tspan x="60" dy="0">单台公网主机 · 2 vCPU / 3499 MiB · Docker Compose · 现有基础设施复用</tspan></text><rect x="35" y="275" width="1370" height="690" rx="20" fill="#edf3f8" stroke="#bacbdb" stroke-dasharray="8 5"/><text x="60" y="306" text-anchor="start" font-size="16" fill="#526477"><tspan x="60" dy="0">Docker 网络 / 私有依赖，仅网站入口公开</tspan></text><rect x="70" y="125" width="410" height="110" rx="14" fill="#e2f3ed" stroke="#61a18e" stroke-width="2"/><text x="275.0" y="156" text-anchor="middle" font-size="18" fill="#203044"><tspan x="275.0" dy="0">浏览器 / 微信工作区</tspan><tspan x="275.0" dy="25">路由拆包 · 原文按需读取</tspan><tspan x="275.0" dy="25">空闲轮询 30 秒</tspan></text><rect x="610" y="135" width="360" height="90" rx="14" fill="#e4edf9" stroke="#7e9cc3" stroke-width="2"/><text x="790.0" y="166" text-anchor="middle" font-size="18" fill="#203044"><tspan x="790.0" dy="0">Caddy HTTPS 入口</tspan><tspan x="790.0" dy="25">GET 压缩 / 哈希资源缓存</tspan></text><polyline points="480,180 610,180" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><rect x="610" y="335" width="360" height="85" rx="14" fill="#d9eff3" stroke="#318b9c" stroke-width="2"/><text x="790.0" y="366" text-anchor="middle" font-size="18" fill="#203044"><tspan x="790.0" dy="0">API 容器</tspan><tspan x="790.0" dy="25">鉴权 / 短请求 / HTTP 202</tspan></text><polyline points="790,225 790,335" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><rect x="75" y="465" width="330" height="110" rx="14" fill="#fff" stroke="#c8d3df" stroke-width="2"/><text x="240.0" y="496" text-anchor="middle" font-size="18" fill="#203044"><tspan x="240.0" dy="0">身份路径</tspan><tspan x="240.0" dy="25">验证码 / 会话 / 用户校验</tspan><tspan x="240.0" dy="25">不加载邮箱与执行历史</tspan></text><rect x="530" y="465" width="350" height="110" rx="14" fill="#fff" stroke="#c8d3df" stroke-width="2"/><text x="705.0" y="496" text-anchor="middle" font-size="18" fill="#203044"><tspan x="705.0" dy="0">按用途只读快照</tspan><tspan x="705.0" dy="25">列表 / 原文 / 附件元数据</tspan><tspan x="705.0" dy="25">执行历史独立加载</tspan></text><rect x="1010" y="465" width="330" height="110" rx="14" fill="#fff" stroke="#c8d3df" stroke-width="2"/><text x="1175.0" y="496" text-anchor="middle" font-size="18" fill="#203044"><tspan x="1175.0" dy="0">业务写入 / 可靠任务</tspan><tspan x="1175.0" dy="25">完整快照 + CAS + 围栏</tspan><tspan x="1175.0" dy="25">提交成功后响应</tspan></text><polyline points="700,420 700,443 240,443 240,465" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="790,420 790,445 705,445 705,465" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="880,420 880,443 1175,443 1175,465" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><rect x="75" y="635" width="330" height="80" rx="14" fill="#fdeee7" stroke="#c99072" stroke-width="2"/><text x="240.0" y="666" text-anchor="middle" font-size="18" fill="#203044"><tspan x="240.0" dy="0">Redis</tspan><tspan x="240.0" dy="25">一次性验证码 / 会话</tspan></text><rect x="530" y="635" width="350" height="80" rx="14" fill="#e4edf9" stroke="#7e9cc3" stroke-width="2"/><text x="705.0" y="666" text-anchor="middle" font-size="18" fill="#203044"><tspan x="705.0" dy="0">PostgreSQL 权威状态</tspan><tspan x="705.0" dy="25">业务 / 任务 / 版本 / Outbox</tspan></text><rect x="1010" y="635" width="330" height="80" rx="14" fill="#ede8f8" stroke="#a391c0" stroke-width="2"/><text x="1175.0" y="666" text-anchor="middle" font-size="18" fill="#203044"><tspan x="1175.0" dy="0">私有 MinIO / S3</tspan><tspan x="1175.0" dy="25">附件字节 · 归属核验后读取</tspan></text><polyline points="240,575 240,635" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="705,575 705,635" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><text x="765" y="610" text-anchor="middle" font-size="14" fill="#203044"><tspan x="765" dy="0">SQL 投影</tspan></text><polyline points="405,550 455,550 455,615 580,615 580,635" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><text x="515" y="600" text-anchor="middle" font-size="14" fill="#203044"><tspan x="515" dy="0">用户校验</tspan></text><polyline points="880,550 975,550 975,610 1175,610 1175,635" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><text x="1100" y="600" text-anchor="middle" font-size="14" fill="#203044"><tspan x="1100" dy="0">附件鉴权后读取</tspan></text><polyline points="1010,535 930,535 930,675 880,675" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><text x="948" y="705" text-anchor="middle" font-size="14" fill="#203044"><tspan x="948" dy="0">CAS 写入</tspan></text><rect x="75" y="800" width="330" height="100" rx="14" fill="#fff" stroke="#c8d3df" stroke-width="2"/><text x="240.0" y="831" text-anchor="middle" font-size="18" fill="#203044"><tspan x="240.0" dy="0">Scheduler 容器</tspan><tspan x="240.0" dy="25">每分钟检查到期邮箱</tspan><tspan x="240.0" dy="25">600 秒间隔 / 在途屏障</tspan></text><rect x="530" y="800" width="350" height="100" rx="14" fill="#fff" stroke="#c8d3df" stroke-width="2"/><text x="705.0" y="831" text-anchor="middle" font-size="18" fill="#203044"><tspan x="705.0" dy="0">RabbitMQ / Outbox</tspan><tspan x="705.0" dy="25">任务通知与重投</tspan><tspan x="705.0" dy="25">PostgreSQL 保存任务真相</tspan></text><rect x="1010" y="800" width="330" height="100" rx="14" fill="#d9eff3" stroke="#318b9c" stroke-width="2"/><text x="1175.0" y="831" text-anchor="middle" font-size="18" fill="#203044"><tspan x="1175.0" dy="0">Worker 容器</tspan><tspan x="1175.0" dy="25">IMAP / 模型 / OCR</tspan><tspan x="1175.0" dy="25">已完成邮件免逐封快照</tspan></text><polyline points="405,850 465,850 465,675 530,675" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="705,715 705,800" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="880,850 1010,850" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><polyline points="1175,800 1175,745 880,745 880,708" fill="none" stroke="#63778e" stroke-width="2.3" marker-end="url(#arrow)" /><text x="1000" y="765" text-anchor="middle" font-size="14" fill="#203044"><tspan x="1000" dy="0">检查点 / 版本 / 租约</tspan></text><text x="60" y="1006" text-anchor="start" font-size="17" fill="#46576b"><tspan x="60" dy="0">实线 = 已运行路径；本轮未新增 K8s、副本或托管云服务。服务拆分已有，本轮缩小读取与同步的工作量。</tspan></text></g></svg>